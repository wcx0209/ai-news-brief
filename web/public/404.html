<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex,follow">
  <title>Page not found | Polyemergence</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    :root{color-scheme:light;background:#f3f3f1;color:#111;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#fff 0 58%,#e7e7e3 58% 100%)}
    main{width:min(680px,100%);padding:clamp(32px,7vw,72px);background:#111;color:#fff;border-top:12px solid #ff5a1f;box-shadow:0 24px 80px rgba(0,0,0,.16)}
    p{margin:0 0 20px;color:#b9b9b5;line-height:1.65}strong{display:block;margin-bottom:18px;color:#ff5a1f;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0 0 20px;font-size:clamp(2.2rem,8vw,5.6rem);line-height:.92;letter-spacing:-.06em}nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
    a{display:inline-block;padding:11px 16px;border:1px solid #555;color:#fff;text-decoration:none;font-weight:700}a:first-child{border-color:#ff5a1f;background:#ff5a1f;color:#111}a:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <strong>404 / Signal not found</strong>
    <h1>Nothing emerged here.</h1>
