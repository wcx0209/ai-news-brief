llm:
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: ""
  model_name: "gemini-3.5-flash-lite"
  scoring_model_name: "gemini-3.5-flash-lite"

schedule:
  interval_hours: 24

supabase:
  db_url: ""

fetching:
  network_timeout: 60
  ai_timeout: 90
  max_input_chars: 30000
  concurrency: 1
  max_entries: 18
  max_entries_per_source: 1
  llm_min_interval_seconds: 15
  article_max_age_days: 2
  hf_daily_top_n: 5
  discussion:
    min_likes: 40
    min_replies: 15
    max_age_days: 3
    max_update_hours: 36
    min_age_hours: 2
    search_delay_min: 2
    search_delay_max: 5
    post_delay_min: 2
    post_delay_max: 5
  reddit:
    max_per_run: 0
    max_posts_per_keyword: 0
  twitter:
    enabled: false
    max_per_run: 0
    max_posts_per_keyword: 0
  youtube:
    max_per_run: 2
    delay_min: 15
    delay_max: 25
  github_trending:
    enabled: true
    max_repos: 2
    since: "weekly"
  playwright_domains: []

cleanup:
  # Zero means keep the complete article and vector history permanently.
  article_retention_days: 0
  tag_stats_retention_days: 90
