name: Polyemergence daily brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC / 14:00 Singapore
    - cron: "0 18 * * *" # 18:00 UTC / 02:00 Singapore (next day)

permissions:
  contents: write

concurrency:
  group: polyemergence-daily-brief
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INBRIEF_CONFIG_PATH: config.free.yaml
      INBRIEF_SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      INBRIEF_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INBRIEF_LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      INBRIEF_LLM_MODEL_NAME: gemini-3.8-flash
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-minilm-${{ runner.os }}-v1

      - name: Check required secrets
        run: |
          test -n "$INBRIEF_LLM_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)

      - name: Install collector
        run: pip install -r requirements.txt

      - name: Seed free sources
        run: python scripts/bootstrap_sources.py

      - name: Collect and curate
        run: python scripts/run_once.py

      - name: Export public feed
        run: python scripts/export_public_feed.py --output web/public/data/latest.json --limit 60 --discover-images 12 --max-open-source 2

      - name: Commit refreshed feed
        run: |
          git config user.name "polyemergence-bot"
          git config user.email "polyemergence-bot@users.noreply.github.com"
          git add web/public/data/latest.json web/public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "data: refresh Polyemergence brief"
            git push
          fi
