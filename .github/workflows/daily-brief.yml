name: Polyemergence daily brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC / 14:00 Singapore
    - cron: "0 18 * * *" # 18:00 UTC / 02:00 Singapore (next day)

permissions:
  contents: write

concurrency:
  group: polyemergence-daily-brief
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INBRIEF_CONFIG_PATH: config.free.yaml
      INBRIEF_SUPABASE_DB_URL: ${{ secrets.INBRIEF_SUPABASE_DB_URL }}
      INBRIEF_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INBRIEF_LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      INBRIEF_LLM_MODEL_NAME: gemini-3.5-flash-lite
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/huggingface
          key: hf-minilm-${{ runner.os }}-v1

      - name: Check required secrets
        run: |
          test -n "$INBRIEF_LLM_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$INBRIEF_SUPABASE_DB_URL" || (echo "Missing INBRIEF_SUPABASE_DB_URL" && exit 1)

      - name: Install collector
        run: pip install -r requirements.txt

      - name: Validate official-source adapters
        run: python -m unittest discover -s tests -v

      - name: Seed free sources
        run: python scripts/bootstrap_sources.py

      - name: Collect and curate
        run: python scripts/run_once.py

      - name: Export public feed
        run: python scripts/export_public_feed.py --output web/public/data/latest.json --limit 60 --discover-images 60 --max-open-source 2 --max-academia 2 --min-academia-importance 70 --min-academia-confidence 65 --max-age-hours 48

      - name: Export permanent archive and RSS
        run: python scripts/export_archive.py --output web/public

      - name: Commit refreshed feed
        run: |
          git config user.name "polyemergence-bot"
          git config user.email "polyemergence-bot@users.noreply.github.com"
          git add web/public/data/latest.json web/public/data/articles.json web/public/sitemap.xml web/public/archive-sitemap.xml web/public/news-sitemap.xml web/public/feed-en.xml web/public/feed-zh.xml web/public/en/archive web/public/zh/archive web/public/en/daily-ai-news web/public/zh/ai-news-daily web/public/en/topics web/public/zh/topics
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "data: refresh Polyemergence brief"
            # A frontend/source update can be published while collection is
            # running. Rebase the generated-data commit onto that update.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
